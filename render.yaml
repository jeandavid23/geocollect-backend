# Blueprint Render.com — déploie le backend Django (API).
# Utilisation : pousser ce repo sur GitHub, puis Render → New → Blueprint → sélectionner le repo.
#
# Base de données : n'importe quelle base PostgreSQL (Neon, Supabase, Render Postgres...).
# Collez sa chaîne de connexion dans Render → service → Environment → DATABASE_URL.
# (La base Render gratuite expire au bout de 30 jours : préférez Neon ou une base payante.)
services:
  - type: web
    name: geocollect-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # postgresql://utilisateur:motdepasse@hôte/base?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Frontend officiel sur Vercel (l'ancien site Netlify reste autorisé dans settings.py)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://geocollect-eudr.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://geocollect-eudr.vercel.app"
      - key: FRONTEND_URL
        value: "https://geocollect-eudr.vercel.app"
      # Analyse déforestation : contenu JSON de la clé du compte de service Google Earth Engine
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
